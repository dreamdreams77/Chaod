name: build

# Keeps the published game in sync with the source: on every push to main the
# workflow typechecks, runs the tests, rebuilds the single-file game and, if the
# root index.html changed, commits it back (GitHub Pages serves the repo root).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit the rebuilt game
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet -- index.html sw.js; then
            echo "index.html is already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html sw.js
            git commit -m "Rebuild index.html [skip ci]"
            git push
          fi
